<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>USHIORI</title>
<style>
/* ===== USHIORI 整理版（所有樣式合併成一份，顏色集中在最上面） ===== */
:root{--base:#9686a0;--ink:#fbeaf1;--deep:#5b4358;--glass:rgba(255,255,255,.16);--line:rgba(255,255,255,.32);--soft:#ecdcee;--nav:54px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:13px;background:var(--base)}
html::before{content:"";position:fixed;left:0;top:0;width:100%;height:100lvh;z-index:-1;background:var(--base) url("photo/bg5.PNG") center top/cover no-repeat}
body{margin:0;min-height:100vh;color:var(--ink);background:transparent;text-align:center;
 font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei","Helvetica Neue",Arial,sans-serif;
 padding-bottom:calc(var(--nav) + 8px + env(safe-area-inset-bottom))}
.wrap{max-width:430px;margin:0 auto;padding:30px 34px 20px}
.page{display:none}.page.on{display:block;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* 首頁 */
.head h1{margin:0 0 8px;font-size:1.3rem;font-weight:700;letter-spacing:.02em}
.head p{margin:0 auto 22px;font-size:.64rem;line-height:1.8;color:rgba(251,234,241,.85);text-wrap:balance}
.heart{width:calc(100% + 56px);margin:6px -28px 0}.heart img{width:100%;display:block}
.card,.pc,.qa,.mini{background:var(--glass);border:1px solid var(--line);border-radius:16px;color:var(--ink)}
.card{padding:14px 12px;margin-bottom:14px}
.glass{width:92%;margin:26px auto 0;background:rgba(255,255,255,.26);border-color:rgba(255,255,255,.45)}
.names{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;column-gap:6px;margin:0;font-size:clamp(8px,3vw,12px);font-weight:700;line-height:1.4;white-space:nowrap;color:#fff4f8}
.names i{font-style:normal;padding:0 2px;color:#f3cfe0}
.divider{display:flex;align-items:center;justify-content:center;gap:6px;margin:10px auto;max-width:300px;font-size:.5rem;color:rgba(251,234,241,.85)}
.divider i{flex:1;height:1px;background:rgba(251,234,241,.5)}.divider b{font-weight:400;font-size:.66rem}
.since{font-size:.6rem;letter-spacing:.14em;color:rgba(255,255,255,.9)}
.n{margin:4px 0 0;font-size:1.7rem;color:#fff4f8}
.warn{margin-top:8px;font-size:.7rem;letter-spacing:.08em;color:rgba(255,255,255,.88)}
/* 音樂（置中一欄，精簡高度） */
.mp{position:relative;width:92%;margin:14px auto 0;padding:9px 14px 10px;background:rgba(255,255,255,.2)}
.mph{position:absolute;left:14px;right:14px;top:9px;height:20px;display:flex;justify-content:space-between;align-items:center;font-size:1rem;line-height:1;pointer-events:none}
.mph button{pointer-events:auto;border:0;background:none;color:var(--ink);font-size:1rem;cursor:pointer;padding:2px 4px;line-height:1}
.mt{margin:0;padding:0 26px;height:20px;line-height:20px;font-size:.95rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp.min .mpb{display:none}.mp.min{padding-bottom:9px}
.pbar{position:relative;height:14px;margin:6px 0 0;touch-action:none;cursor:pointer}
.pbar::before{content:"";position:absolute;left:0;right:0;top:4px;height:6px;border-radius:99px;background:rgba(255,255,255,.3)}
.pfill{position:absolute;left:0;top:4px;height:6px;width:0;border-radius:99px;background:rgba(255,255,255,.75)}
.pthumb{position:absolute;top:0;left:0;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--deep)}
.ptm{display:flex;justify-content:space-between;font-size:.6rem;line-height:1.2;opacity:.8}
.ctl{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:4px}
.ctl button{width:34px;height:34px;border:0;border-radius:50%;background:rgba(255,255,255,.24);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.ctl button#pp{width:38px;height:38px}
.ctl button svg{width:14px;height:14px}
.lk{display:none!important;border:0;background:none;color:var(--ink);padding:6px 8px;cursor:pointer;font-size:.58rem}
/* 角色頁 */
.sheet{border-radius:16px;overflow:hidden;margin-bottom:14px;cursor:pointer;background:transparent}
.sheet img{width:100%;display:block;max-height:68vh;object-fit:contain}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
.pc{padding:14px 10px 6px}.pc h2{margin:0;font-size:1.1rem;font-weight:600;line-height:1.25;color:#fff4f8}
.pc .nm2{margin-top:2px;font-size:1.05rem;font-weight:600;line-height:1.25;color:#fff4f8}
.pc .lines p{margin:0 0 13px;font-size:.88rem;font-weight:500;line-height:1.4;color:#fff}
.en{margin:2px 0 8px;font-size:.6rem;letter-spacing:.14em;color:rgba(251,234,241,.7)}
.dots{display:flex;gap:6px;justify-content:center;margin:10px 0 16px}
.dots i{width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 1px rgba(255,255,255,.6)}
.pc dl{margin:0}.pc dt{margin-top:9px;font-size:.58rem;letter-spacing:.12em;color:rgba(251,234,241,.7)}
.pc dd{margin:1px 0 0;font-size:.82rem;line-height:1.55;color:#fff}
.mini{margin-top:12px;padding:8px 6px}
.noterow{display:grid;grid-template-columns:1fr minmax(0,38%) 1fr;align-items:center;margin:12px -26px 0}
.noterow .mini{grid-column:2;margin-top:0;min-width:0}
#sideL{grid-column:1}#sideR{grid-column:3}
.side{justify-self:center;width:88%;max-width:92px;height:auto}#sideL{justify-self:end}#sideR{justify-self:start}.side[hidden]{display:none}
.mini h3,.qh{margin:0 0 10px;font-size:.62rem;font-weight:400;letter-spacing:.2em;color:#fff4f8}
.qh{font-size:.7rem;margin:2px 0 14px}
.mrow{margin-bottom:12px}.mrow:last-child{margin-bottom:0}
.lab{display:block;margin-bottom:5px;font-size:.6rem;letter-spacing:.08em;color:rgba(251,234,241,.7)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini .pair span,.mini .both{background:none;color:#fff;font-weight:600;border-radius:0;padding:2px 1px;font-size:.68rem}
.mini h3{margin:0 0 4px;font-size:.5rem;letter-spacing:.12em}
.mini .mrow{margin-bottom:4px}.mini .mrow:last-child{margin-bottom:0}
.mini .lab{margin-bottom:1px;font-size:.5rem}.both{display:block}
/* 第二頁：兩張角色卡共用一個大格子，中間用愛心分隔線，下面是情侶筆記與兩旁的小人 */
.pbig{padding:18px 8px 14px;margin-bottom:0}
.pbig .pc{background:none;border:0;padding:0}
.pbig .mini{background:none;border:0;padding:0;margin:0}
.hdiv{display:flex;align-items:center;gap:8px;margin:6px 8px 14px;color:rgba(251,234,241,.9);font-size:.75rem}
.hdiv i{flex:1;height:1px;background:rgba(251,234,241,.5)}
.pbig .noterow{grid-template-columns:1fr minmax(0,42%) 1fr;margin:0}
.pbig .side{width:auto;height:auto;max-width:80px;max-height:108px;justify-self:center}
.pbig #sideL,.pbig #sideR{justify-self:center}
.qa .pair span{background:#fff;color:var(--deep);border-radius:99px;padding:6px 10px;font-size:.85rem}
.qa{padding:14px 12px;margin-bottom:12px}.qa h3{margin:0 0 10px;font-size:.82rem;font-weight:500;color:#fff4f8}
.qa h3 b{margin-right:6px;color:#f3cfe0}.pair .ans{background:#fff;color:var(--deep);border-radius:14px;padding:8px 10px;font-size:.82rem;line-height:1.6}
.ans:last-child{background:#f6e3ed}.who{display:block;margin-bottom:2px;font-size:.58rem;letter-spacing:.12em;color:#a595c0}
.qavs{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:8px;justify-items:center;align-items:center;margin:0 0 16px;padding:0 13px}
.qavs img{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid #fff;background:#eadff0}
.qavs img[src=""]{display:none}
.qavs b{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:.7rem;letter-spacing:.1em;color:#fff4f8}


/* 相簿 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{position:relative;background:#fff;color:var(--deep);border-radius:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.item img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block}
.item .t{padding:5px 6px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;flex:1}
.item h3{margin:0;font-size:.78rem;line-height:1.25}.item .txt{margin:0;max-width:100%;font-size:.6rem;line-height:1.3;color:#8a7a95;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.item .dt{width:100%;margin-top:1px;font-style:italic;font-size:.64rem;line-height:1.3;color:#8a7a95}
.item .im{position:relative}
.item .lockb{position:absolute;right:6px;top:6px;background:rgba(255,255,255,.85);border-radius:99px;padding:2px 7px;font-size:.8rem}
.item .soon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.7rem;letter-spacing:.22em;text-shadow:0 1px 5px rgba(60,30,80,.5);background:rgba(60,30,80,.28)}
.item.lockedv .im{overflow:hidden}
.item.lockedv .im img{filter:blur(16px);transform:scale(1.3)}
.item .mv{position:absolute;left:6px;top:6px;display:flex;gap:4px}.item .mv button{border:0;border-radius:99px;background:rgba(255,255,255,.88);color:var(--deep);width:28px;height:28px;font-size:.72rem;cursor:pointer;padding:0}.item .mv button:disabled{opacity:.35}
#p-gallery{margin:0 -20px}
#p-gallery .grid{gap:8px}
.cats{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:0 0 14px}
.cats button{border:0;border-radius:99px;padding:5px 12px;font-size:.72rem;letter-spacing:.05em;color:var(--ink);background:rgba(255,255,255,.14);opacity:.8;cursor:pointer}
.cats button.on{background:rgba(255,255,255,.32);color:#fff;opacity:1}
#eCat{display:block;width:100%;border:1px solid #d8c9ee;border-radius:10px;padding:8px 10px;margin:6px 0;font-family:inherit;font-size:.88rem;color:var(--deep);background:#fff}
.ordrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #eee}
.ordrow img,.ordrow i{width:48px;height:36px;border-radius:6px;object-fit:cover;background:#ddd;flex:0 0 48px}
.ordrow span{flex:1;min-width:0;font-size:.82rem;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ordrow button{border:0;border-radius:8px;background:#f1dfeb;color:var(--deep);width:34px;height:30px;cursor:pointer;padding:0}.ordrow button:disabled{opacity:.3}
.lockrow{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:.78rem;line-height:1.5;text-align:left}.lockrow input{margin-top:3px}
/* 分頁列、按鈕 */
nav{position:fixed;left:40px;right:40px;bottom:calc(8px + env(safe-area-inset-bottom));max-width:420px;margin:0 auto;height:var(--nav);z-index:30;display:flex;padding:3px;border-radius:18px;
 background:rgba(255,255,255,.18);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line)}
nav button{flex:1;border:0;background:none;color:var(--ink);opacity:.72;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.5rem;letter-spacing:.1em;border-radius:15px;cursor:pointer}
nav button svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button.on{background:rgba(255,255,255,.22);color:#fff;opacity:1}
.fab{position:fixed;right:14px;z-index:25;width:38px;height:38px;border-radius:50%;font-size:.9rem;cursor:pointer;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4)}
#fabNote{bottom:calc(var(--nav) + 24px + env(safe-area-inset-bottom))}
#fabGame{bottom:calc(var(--nav) + 70px + env(safe-area-inset-bottom))}
.gwrap{position:relative;padding:8px}
#gcv{display:block;margin:0 auto;border-radius:12px;touch-action:none;background:#cdb9e0}
.ghudrow{display:flex;align-items:center;gap:10px;padding:2px 4px 8px;font-size:.85rem}
.gprog{flex:1;height:6px;border-radius:99px;background:rgba(91,67,88,.15);overflow:hidden}.gprog i{display:block;height:100%;width:0;background:#c98fb3;border-radius:99px}
.gov{position:absolute;left:8px;right:8px;top:36px;bottom:8px;border-radius:12px;background:rgba(70,40,90,.6);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;color:#fff;text-align:center;font-size:1rem;line-height:1.7}
.gov small{font-size:.75rem;opacity:.8}
.btn{border:0;background:#fbeaf1;color:#7a5a82;border-radius:99px;padding:8px 16px;font-family:inherit;cursor:pointer;margin-top:8px}
/* 通知與彈窗 */
.toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translate(-50%,-140%);width:calc(100% - 28px);max-width:380px;z-index:70;background:rgba(255,250,252,.97);color:var(--deep);
 border-radius:18px;padding:8px 12px;display:flex;gap:10px;align-items:center;text-align:left;cursor:pointer;box-shadow:0 8px 22px rgba(60,30,80,.3);transition:transform .45s cubic-bezier(.2,.9,.3,1.2)}
.toast.show{transform:translate(-50%,0)}
.toast.show::after{content:"";position:absolute;left:8px;top:5px;width:12px;height:12px;border-radius:50%;background:#e5484d;border:2px solid #fff}
.wrap{transition:padding-top .3s}body.hasToast .wrap{padding-top:calc(96px + env(safe-area-inset-top))}
#m-chat.mustread .bar button{opacity:.25}
.win.nope{animation:nope .35s}@keyframes nope{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.toast b{display:block;font-size:.8rem}.toast span{display:block;font-size:.78rem;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tBadge{background:#e5484d;color:#fff;border-radius:99px;min-width:20px;height:20px;padding:0 6px;font-size:.7rem;font-style:normal;display:none;align-items:center;justify-content:center}
.modal{position:fixed;inset:0;background:rgba(70,40,90,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
#m-card{z-index:60}.modal.open{display:flex}
.win{width:100%;max-width:400px;max-height:84vh;overflow:auto;background:#fbf3f7;color:var(--deep);border-radius:14px;box-shadow:0 14px 30px rgba(60,30,80,.35);animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.bar{display:flex;justify-content:space-between;align-items:center;background:var(--soft);padding:8px 12px;font-size:.85rem;position:sticky;top:0}
.bar button{width:24px;height:24px;border:0;background:#fff;border-radius:7px;font-size:.75rem;padding:0;color:var(--deep);cursor:pointer}
.body{padding:14px;font-size:.9rem;line-height:1.8}.body img{width:100%;border-radius:10px;margin-bottom:10px;display:block}
.hint{text-align:center;font-size:.75rem;opacity:.6;padding:6px}
.chat{display:flex;flex-direction:column;gap:8px;min-height:200px;text-align:left}
.crow{display:flex;gap:8px;align-items:flex-end;width:100%}.crow.me{flex-direction:row-reverse}
.av{width:34px;height:34px;flex:0 0 34px;border-radius:50%;object-fit:cover;background:#eadff0;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:1.05rem}
.b{max-width:76%;padding:8px 12px;border-radius:14px;background:#d8c2e2;color:#4a3558;opacity:0;animation:in .3s forwards}
.b.me{background:#f1dfeb}.b.sticker-bubble{background:transparent;padding:0}
.b.sticker-bubble img{width:130px;max-width:100%;height:auto;margin:0;border-radius:0}
@keyframes in{to{opacity:1}}
.typing{display:flex;gap:4px;padding:11px 14px}.typing i{width:6px;height:6px;border-radius:50%;background:#a58bd0;animation:dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{50%{transform:translateY(-4px);opacity:.4}}
/* 便條留言板 */
#noteText{width:100%;min-height:120px;resize:vertical;border:1px solid #d8c9ee;border-radius:12px;padding:10px;font-family:inherit;font-size:.88rem;color:var(--deep);background:#fff}
#noteNick{width:58%;border:1px solid #d8c9ee;border-radius:99px;padding:6px 12px;margin-bottom:6px;font-family:inherit;font-size:.78rem;color:var(--deep);background:#fff}
#swatches{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 8px}
.sw{width:36px;height:36px;border-radius:9px;border:2.5px solid transparent;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.12)}.sw.on{border-color:var(--deep)}
.noteRow{display:flex;justify-content:space-between;align-items:center;font-size:.72rem;margin-top:6px}
.wall{position:relative;border:8px solid #8e87a6;outline:3px solid rgba(255,255,255,.85);border-radius:22px;padding:22px 6px 26px;min-height:240px;background:radial-gradient(circle,#c9c1da 2.8px,transparent 3.4px) 0 0/22px 22px,#ece8f4;display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:2px 0;box-shadow:inset 0 2px 8px rgba(70,50,100,.14)}
#m-note .win{max-width:440px}
.photorow{display:flex;align-items:center;gap:8px;margin:4px 0}
/* 洞洞板上的便條與塗鴉：大小、形狀、角度都不一樣 */
.pn{position:relative;padding:20px 8px 9px;background:var(--c,#fff);color:#5a4b63;filter:drop-shadow(0 2px 3px rgba(60,40,90,.3));cursor:pointer;text-align:center;word-break:break-word;font-size:.6rem;line-height:1.35}
.pn::before{content:"";position:absolute;top:5px;left:50%;width:11px;height:11px;margin-left:-5.5px;border-radius:50%;border:3px solid #7d7794;background:#ece8f4}
.pn:hover{z-index:20!important}
.pn .hd{display:flex;justify-content:center;gap:5px;margin-bottom:2px;font-size:.46rem;color:#a090ae}
.pn .nm{font-weight:700;color:#6b5a78;max-width:6em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn .tx{white-space:pre-wrap;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--lc,6);overflow:hidden}
.pn img{display:block;width:100%;aspect-ratio:1/1;object-fit:contain;margin:0 0 4px}
.pn-paper{border-radius:3px}
.pn-tag{border-radius:16px 16px 5px 5px;border:2px solid rgba(70,60,100,.35)}
.pn-ticket{border-radius:5px;border-left:4px dotted rgba(70,60,100,.3);border-right:4px dotted rgba(70,60,100,.3)}
.pn-card{border-radius:3px;background:var(--c,#fff) repeating-linear-gradient(transparent 0 19px,rgba(70,60,100,.1) 19px 20px);line-height:20px}
.pn-round{border-radius:50%;aspect-ratio:1/1;display:flex;flex-direction:column;justify-content:center;padding:20px 12px 10px}
.pn-round::before{top:3px}.pn-round img{border-radius:50%}
.pn-pill{border-radius:999px;padding:18px 16px 9px}.pn-pill::before{display:none}.pn-pill img{border-radius:50%}
.pn-strip{border-radius:2px;padding:18px 5px 8px}
.pn-fold{border-radius:3px}
.pnw{position:relative;filter:drop-shadow(0 2px 3px rgba(60,40,90,.3));cursor:pointer}.pnw:hover{z-index:20!important}
.pn-heart,.pn-star,.pn-bow{filter:none;display:flex;flex-direction:column;justify-content:center;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:100% 100%;mask-size:100% 100%}
.pn-heart{aspect-ratio:1/1;padding:38% 20% 18%;-webkit-mask-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' preserveAspectRatio='none'><path d='M50 92C20 70 3 52 3 31 3 14 15 5 28 5c10 0 18 6 22 14 4-8 12-14 22-14 13 0 25 9 25 26 0 21-17 39-47 61z'/></svg>");mask-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' preserveAspectRatio='none'><path d='M50 92C20 70 3 52 3 31 3 14 15 5 28 5c10 0 18 6 22 14 4-8 12-14 22-14 13 0 25 9 25 26 0 21-17 39-47 61z'/></svg>")}
.pn-heart::before{top:19%}
.pn-star{aspect-ratio:1/1;padding:43% 26% 18%;-webkit-mask-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' preserveAspectRatio='none'><polygon points='50,3 62,36 97,38 69,59 80,94 50,73 20,94 31,59 3,38 38,36'/></svg>");mask-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' preserveAspectRatio='none'><polygon points='50,3 62,36 97,38 69,59 80,94 50,73 20,94 31,59 3,38 38,36'/></svg>")}
.pn-star::before{top:15%}

function trimmed(src,cb){const i=new Image();i.onload=()=>{try{
  const nw=i.naturalWidth,nh=i.naturalHeight,s=Math.min(1,500/Math.max(nw,nh)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(nw*s));c.height=Math.max(1,Math.round(nh*s));
  const g=c.getContext('2d');g.drawImage(i,0,0,c.width,c.height);const d=g.getImageData(0,0,c.width,c.height).data;let x0=c.width,y0=c.height,x1=-1,y1=-1;
  for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++)if(d[(y*c.width+x)*4+3]>10){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
  if(x1<0){cb(src);return;}
  const sx=x0/s,sy=y0/s,sw=(x1-x0+1)/s,sh=(y1-y0+1)/s,k=Math.min(1,420/Math.max(sw,sh)),o=document.createElement('canvas');o.width=Math.max(1,Math.round(sw*k));o.height=Math.max(1,Math.round(sh*k));
  o.getContext('2d').drawImage(i,sx,sy,sw,sh,0,0,o.width,o.height);cb(o.toDataURL('image/png'));}catch(e){cb(src);}};i.onerror=()=>cb(null);i.src=src;}

function padRedraw(){pcx.clearRect(0,0,pcv.width,pcv.height);pcx.lineCap='round';pcx.lineJoin='round';
  for(const s of strokes){pcx.globalCompositeOperation=s.er?'destination-out':'source-over';pcx.strokeStyle=s.c;pcx.fillStyle=s.c;pcx.lineWidth=s.w;
    if(s.p.length<2){pcx.beginPath();pcx.arc(s.p[0][0],s.p[0][1],s.w/2,0,7);pcx.fill();continue;}

    for(let i=1;i<s.p.length-1;i++){const a=s.p[i],b=s.p[i+1];pcx.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2);}
    const l=s.p[s.p.length-1];pcx.lineTo(l[0],l[1]);pcx.stroke();}
  pcx.globalCompositeOperation='source-over';}

const au=new Audio();let ti=0,drag=false;
const PLAY='<svg viewBox="0 0 24 24"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>',PAUSE='<svg viewBox="0 0 24 24"><path fill="currentColor" d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';
const fmt=s=>{s=isFinite(s)?Math.max(0,Math.floor(s)):0;return Math.floor(s/60)+':'+p2(s%60)};
function draw(){const d=au.duration,c=au.currentTime||0,ok=isFinite(d)&&d>0;
  const pc=ok?c/d*100:0;$('pfill').style.width=pc+'%';$('pthumb').style.left=`calc(${pc}% - ${pc/100*14}px)`;$('t1').textContent=fmt(c);$('t2').textContent=fmt(ok?d:0);

function load(i,go){if(!TRACKS.length)return;ti=(i+TRACKS.length)%TRACKS.length;au.src=TRACKS[ti].src;if(go)au.play().catch(()=>{});draw();}
['timeupdate','play','pause','loadedmetadata','durationchange'].forEach(n=>au.addEventListener(n,draw));au.onended=()=>load(ti+1,true);
function seek(e){const r=$('pbar').getBoundingClientRect(),p=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));if(isFinite(au.duration))au.currentTime=p*au.duration;draw();}

/* 自動讀取 GitHub 倉庫的資料夾：
   music 資料夾裡的音檔 → 自動加進播放器（檔名＝歌名）
   gallery 資料夾裡的圖片 → 自動變成相簿卡片（檔名格式「標題_日期.jpg」，日期可省略） */
async function ghList(dir){try{
  const host=location.hostname;if(!host.endsWith('.github.io'))return[];
  const owner=host.split('.')[0],repo=location.pathname.split('/')[1];if(!repo)return[];
  const r=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${dir}`);if(!r.ok)return[];
  return(await r.json()).filter(f=>f.type==='file').sort((a,b)=>a.name.localeCompare(b.name,'zh'));
}catch(e){return[];}}
(async()=>{
  const fs=(await ghList('music')).filter(f=>/\.(mp3|m4a|aac|wav|ogg|flac)$/i.test(f.name));
  if(!fs.length)return;
  TRACKS.length=0;fs.forEach(f=>TRACKS.push({name:f.name.replace(/\.[^.]+$/,''),src:'music/'+encodeURIComponent(f.name)}));
  if(au.paused){au.removeAttribute('src');ti=0;}draw();
})();

/* 圖片轉 ASCII 字元畫（載入畫面用） */
function asciiDataURL(src,cols,cell,cb){const im=new Image();
  im.onload=()=>{try{const rows=Math.max(1,Math.round(cols*im.height/im.width)),sc=document.createElement('canvas');sc.width=cols;sc.height=rows;
    const sx=sc.getContext('2d');sx.drawImage(im,0,0,cols,rows);const d=sx.getImageData(0,0,cols,rows).data;let lo=1,hi=0;const lum=[];
    for(let i=0;i<d.length;i+=4){const v=(0.299*d[i]+0.587*d[i+1]+0.114*d[i+2])/255;lum.push(v);if(v<lo)lo=v;if(v>hi)hi=v;}
    const span=Math.max(.15,hi-lo),o=document.createElement('canvas');o.width=cols*cell;o.height=rows*cell;const ox=o.getContext('2d');
    ox.fillStyle='#fbf6f8';ox.fillRect(0,0,o.width,o.height);ox.fillStyle='#8d5a77';ox.font='bold '+(cell*1.05)+'px "Courier New",monospace';ox.textBaseline='top';
    const ramp=' .:-=+*#%@';for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const l=Math.min(1,Math.max(0,(lum[y*cols+x]-lo)/span)),
      ch=ramp[Math.min(ramp.length-1,Math.floor((1-l)*ramp.length))];if(ch!==' ')ox.fillText(ch,x*cell,y*cell);}
    cb(o.toDataURL('image/png'));}catch(e){cb(null);}};im.onerror=()=>cb(null);im.src=src;}

/* 載入畫面：進度條至少跑 2.6 秒，圖片沒載完就先等（最多 6 秒） */
(function(){
  const urls=[...new Set([...document.images].map(i=>i.getAttribute('src')).concat(CARDS.map(c=>c.img),CHIBIS.map(c=>c.img),[AVATAR_A,AVATAR_ME,SHEET.img]))].filter(Boolean);
  const total=urls.length;let n=0,shown=0,entered=false;const t0=performance.now(),DURATION=2600;
  const fill=$('fill'),pct=$('pct'),ld=$('loader'),run=$('lRun');
  if(LOADER_TOP){$('lTop').hidden=false;$('lTop').src=LOADER_TOP;if(LOADER_ASCII)asciiDataURL(LOADER_TOP,48,4,u=>{if(u)$('lTop').src=u;});if(LOADER_TOP_CUT)$('lTop').classList.add('cut');}
  if(LOADER_RUNNER){run.hidden=false;run.onerror=()=>{run.hidden=true;};run.src=LOADER_RUNNER;if(LOADER_RUNNER_CUT)run.classList.add('cut');}
  [...'LOADING...'].forEach((ch,i)=>{const sp=document.createElement('span');sp.textContent=ch;sp.style.animationDelay=(i*0.09)+'s';$('lTxt').appendChild(sp);});
  document.body.style.overflow='hidden';setTimeout(()=>{n=total;},6000);
  urls.forEach(u=>{const im=new Image();im.onload=im.onerror=()=>{n++};im.src=u;});
  function paint(p){fill.style.width=p+'%';pct.textContent=Math.round(p)+'%';}
  function enter(){ld.classList.add('done');document.body.style.overflow='';setTimeout(startChat,3500);
    if(!TRACKS.length)return;load(0,false);au.play().catch(()=>{addEventListener('pointerdown',()=>{if(au.paused)au.play().catch(()=>{});},{once:true});});}
  function frame(now){const timeP=Math.min(1,(now-t0)/DURATION),easeP=1-Math.pow(1-timeP,1.6),realP=total?Math.min(1,n/total):1;
    shown=Math.max(shown,Math.min(easeP,realP)*100);paint(shown);
    if(shown>=100&&!entered){entered=true;setTimeout(enter,450);return;}requestAnimationFrame(frame);}
  paint(0);requestAnimationFrame(frame);
})();
</script>
<script>
/* 接住你 ♡：小魚從空中掉下來，躲開障礙物，最後落進牛島的懷裡 */
(function(){
  const $=id=>document.getElementById(id);
  const cv=$('gcv'),ctx=cv.getContext('2d'),W=300,H=420,dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=W*dpr;cv.height=H*dpr;ctx.scale(dpr,dpr);
  const modal=$('m-game'),ov=$('gov'),ovT=$('govT'),ovB=$('govB'),hud=$('ghud'),bar=$('gbar');
  const mk=(src,emoji)=>{const o={img:null,emoji};if(src){const i=new Image();i.onload=()=>{o.img=i};i.src=src;}return o;};
  const ME=mk(typeof AVATAR_ME!=='undefined'?AVATAR_ME:'','🐟'), HIM=mk(typeof AVATAR_A!=='undefined'?AVATAR_A:'','🐮');
  const BG={img:null};{const i=new Image();i.onload=()=>{BG.img=i};i.src=(typeof GAME_BG!=='undefined'?GAME_BG:'');}
  const LEN=2600,PR=15,GY=H-34,TYPES=[{e:'🏐',r:15,amp:0},{e:'🐦',r:14,amp:28},{e:'☁️',r:20,amp:14},{e:'⚡',r:14,amp:0}];
  let st='idle',raf=0,last=0,x=W/2,tx=W/2,py=90,dist=0,lives=3,inv=0,obs=[],spawn=0,phase='fall',ux=W/2,parts=[],t0=0,tEnd=0;

  function bgRate(){if(BG.img){const ih=BG.img.height*W/BG.img.width;return Math.max(0,ih-H)/LEN;}return .43;} // 背景捲動速度（牛島跟背景一起升起）
  function setHud(){hud.textContent='❤️'.repeat(Math.max(0,lives))+'🤍'.repeat(Math.max(0,3-lives));bar.style.width=Math.min(100,dist/LEN*100)+'%';}
  function reset(){x=tx=W/2;py=90;dist=0;lives=3;inv=0;obs=[];spawn=0;phase='fall';ux=50+Math.random()*(W-100);parts=[];setHud();}
  function show(t,b){ovT.innerHTML=t;ovB.textContent=b;ov.style.display='flex';}
  function start(){reset();st='play';ov.style.display='none';t0=performance.now();}
  function addObs(){const t=TYPES[Math.floor(Math.random()*TYPES.length)],bx=22+Math.random()*(W-44);
    obs.push({e:t.e,r:t.r,amp:t.amp,bx,x:bx,y:H+24,t:Math.random()*6});}
  function burst(cx,cy,n,em){for(let i=0;i<n;i++)parts.push({x:cx,y:cy,vx:(Math.random()-.5)*120,vy:-30-Math.random()*90,l:1,e:em});}
  function miss(){lives--;inv=1.4;setHud();if(lives<=0){st='lose';show('掉得太遠了⋯<br>再試一次吧','再玩一次');}}

  function update(dt){
    const sp=110+Math.min(90,dist/LEN*90);
    x+=(tx-x)*Math.min(1,dt*10);inv=Math.max(0,inv-dt);
    if(phase==='fall'){
      dist+=sp*dt;spawn-=sp*dt;
      if(spawn<=0){spawn=75+Math.random()*60-dist/LEN*28;addObs();}
      if(dist>=LEN){dist=LEN;phase='land';}
    }else{
      py+=Math.min(140,60+(py-90)*.5)*dt;
      if(py>=GY-52){
        if(Math.abs(x-ux)<=40){st='win';tEnd=performance.now();py=GY-46;burst(ux,GY-50,22,'💗');
          show('接住了 ♡<br><small>用時 '+((tEnd-t0)/1000).toFixed(1)+' 秒</small>','再玩一次');}
        else{burst(x,GY-20,6,'💦');lives--;setHud();if(lives<=0){st='lose';show('沒有接到⋯<br>再試一次吧','再玩一次');}
          else{py=90;}}
      }
    }
    obs.forEach(o=>{o.y-=sp*dt;o.x=o.bx+Math.sin(o.t+dist/60)*o.amp;});
    obs=obs.filter(o=>o.y>-30);
    if(inv<=0)for(const o of obs){const dx=x-o.x,dy=py-o.y,rr=(PR+o.r)*.78;
      if(dx*dx+dy*dy<rr*rr){obs=obs.filter(q=>q!==o);burst(o.x,o.y,5,'✨');miss();break;}}
    parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=160*dt;p.l-=dt*.9;});parts=parts.filter(p=>p.l>0);
    bar.style.width=Math.min(100,dist/LEN*100)+'%';
  }

  function avatar(o,cx,cy,r,ring){
    ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.closePath();ctx.fillStyle='#eadff0';ctx.fill();
    if(o.img){ctx.clip();ctx.drawImage(o.img,cx-r,cy-r,r*2,r*2);}
    else{ctx.font=Math.round(r*1.3)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#000';ctx.fillText(o.emoji,cx,cy+1);}
    ctx.restore();ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.lineWidth=2.5;ctx.strokeStyle=ring;ctx.stroke();
  }
  function emoji(e,cx,cy,size,a){ctx.save();ctx.globalAlpha=a==null?1:a;ctx.font=size+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#000';ctx.fillText(e,cx,cy);ctx.restore();}

  function draw(ts){
    if(BG.img){const s=W/BG.img.width,ih=BG.img.height*s,off=Math.min(1,dist/LEN)*Math.max(0,ih-H);
      ctx.drawImage(BG.img,0,-off,W,ih);
    }else{
    const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#a894cc');g.addColorStop(1,'#f3d6e6');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    for(let i=0;i<7;i++){const cy=((i*97-dist*.5)%(H+60)+H+60)%(H+60)-30,cx=(i*83+30)%W;
      ctx.fillStyle='rgba(255,255,255,.16)';ctx.beginPath();ctx.arc(cx,cy,16,0,7);ctx.arc(cx+16,cy+4,12,0,7);ctx.arc(cx-15,cy+5,11,0,7);ctx.fill();}
    }
    const uy=GY+Math.max(0,LEN-dist)*bgRate();
    if(uy<H+70){ // 牛島跟著鏡頭往下，慢慢從畫面下方出現，雙手張開
      ctx.strokeStyle='#fbeaf1';ctx.lineWidth=6;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(ux-16,uy-4);ctx.quadraticCurveTo(ux-40,uy-8,ux-36,uy-42);ctx.stroke();
      ctx.beginPath();ctx.moveTo(ux+16,uy-4);ctx.quadraticCurveTo(ux+40,uy-8,ux+36,uy-42);ctx.stroke();
      avatar(HIM,ux,uy-14,22,'#fff');
      ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(0,uy+14,W,Math.max(0,H-uy-14));
    }
    obs.forEach(o=>emoji(o.e,o.x,o.y,o.r*2));
    if(!(inv>0&&Math.floor(ts*12)%2))avatar(ME,x,py,PR,'#fff');
    parts.forEach(p=>emoji(p.e,p.x,p.y,16,Math.max(0,p.l)));
  }
  function loop(now){raf=requestAnimationFrame(loop);const dt=Math.min(.033,(now-last)/1000||0);last=now;if(st==='play')update(dt);draw(now/1000);}

  function size(){const w=Math.min(modal.querySelector('.win').clientWidth-16,innerHeight*.62*W/H);cv.style.width=w+'px';cv.style.height=(w*H/W)+'px';}
  function open(){modal.classList.add('open');size();reset();st='idle';show('躲開障礙物<br>落進牛島的懷裡 ♡<br><small>手指左右拖曳移動</small>','開始');if(!raf){last=performance.now();raf=requestAnimationFrame(loop);}}
  $('fabGame').onclick=open;ovB.onclick=start;
  new MutationObserver(()=>{if(!modal.classList.contains('open')){cancelAnimationFrame(raf);raf=0;st='idle';}}).observe(modal,{attributes:true,attributeFilter:['class']});
  const setX=e=>{const r=cv.getBoundingClientRect();tx=Math.min(W-PR,Math.max(PR,(e.clientX-r.left)/r.width*W));};
  cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);setX(e);});
  cv.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')setX(e);});
  addEventListener('keydown',e=>{if(!modal.classList.contains('open'))return;
    if(e.key==='ArrowLeft')tx=Math.max(PR,tx-34);if(e.key==='ArrowRight')tx=Math.min(W-PR,tx+34);});
})();
</script>
<script>
/* 相簿管理：登入後可以在網站上新增卡片（放照片＋文案），照片可自己調整裁切成同一個比例；點進去看全部照片 */
(function(){
  const $=id=>document.getElementById(id);
  const SB=SB_URL.replace(/\/$/,''),CW=320,CH=214; /* 封面比例 3:2（寬橫） */
  const NAME_RE=/^[A-Za-z0-9_-]{6,60}\.jpg$/;
  const gURL=f=>NAME_RE.test(f||'')?SB+'/storage/v1/object/public/gallery/'+f:'';
  const rid=()=>(window.crypto&&crypto.randomUUID?crypto.randomUUID().replace(/-/g,''):Date.now().toString(36)+Math.random().toString(36).slice(2)).slice(0,24);
  const open=id=>$(id).classList.add('open'),close=id=>$(id).classList.remove('open');

  /* ---- 登入（只有你的帳號能新增、修改、刪除） ---- */
  const A={get(){try{return JSON.parse(localStorage.getItem('gal_adm')||'null')}catch(e){return null}},set(v){try{localStorage.setItem('gal_adm',JSON.stringify(v))}catch(e){}},clear(){try{localStorage.removeItem('gal_adm')}catch(e){}}};
  const keep=j=>A.set({t:j.access_token,r:j.refresh_token,e:Date.now()+(j.expires_in||3600)*1000-60000});
  async function login(email,pw){const r=await fetch(SB+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password:pw})});if(!r.ok)throw 0;keep(await r.json());}
  async function token(){const a=A.get();if(!a)return null;if(Date.now()<a.e)return a.t;
    try{const r=await fetch(SB+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:a.r})});if(!r.ok)throw 0;const j=await r.json();keep(j);return j.access_token;}catch(e){A.clear();return null;}}
  const H=(t,x)=>({apikey:SB_KEY,Authorization:'Bearer '+t,...x});
  const J={'Content-Type':'application/json',Prefer:'return=minimal'};
  /* 管理入口預設是隱藏的：網址後面加 #admin，或連點首頁標題 5 次，才會在這個裝置上出現 */
  const flag=()=>{try{return localStorage.getItem('adm_ui')==='1'}catch(e){return false}};
  const setFlag=v=>{try{v?localStorage.setItem('adm_ui','1'):localStorage.removeItem('adm_ui')}catch(e){}};
  if(location.hash==='#admin')setFlag(true);
  function adminUI(){const on=!!A.get();$('admBar').hidden=!on;$('admBtn').parentElement.hidden=!(on||flag());$('admBtn').textContent=on?'✎ 管理中':'✎ 管理';}
  {const hh=document.querySelector('.head h1');let taps=0,tt=0;hh.addEventListener('click',()=>{const n=Date.now();taps=(n-tt<2500)?taps+1:1;tt=n;if(taps>=5){taps=0;setFlag(true);adminUI();showPage('gallery');}});}

  /* ---- 顯示相簿（分類分頁；順序用「調整順序」手動決定，新增的卡片排在最後） ---- */
  let rows=[],curCat='ALL';
  const CATS=['LD','SD','uori','Gift Art','🐶🐰']; /* 分類名稱，想改就改這裡 */
  const inCat=r=>curCat==='ALL'?r.category!=='Gift Art':r.category===curCat; /* ALL 不顯示 Gift Art */
  function cardEl(row){const d=document.createElement('div');const th=gURL(row.thumb),adm=!!A.get();d.className='item'+(row.locked?' locked lockedv':'');
    d.innerHTML=`<div class="im">${th?`<img src="${th}" alt="" loading="lazy">`:''}${row.locked?'<span class="soon">to be soon</span>':''}</div><div class="t"><h3>${esc(row.title)}</h3>${row.scene?`<p class="txt">${esc(row.scene)}</p>`:''}${row.date?`<span class="dt">${esc(row.date)}</span>`:''}</div>`;
    d.onclick=()=>openGal(row);return d;}
  function renderTabs(){const c=$('cats');c.textContent='';['ALL',...CATS].forEach(n=>{const b=document.createElement('button');b.textContent=n;b.className=n===curCat?'on':'';b.onclick=()=>{curCat=n;renderTabs();renderGrid();};c.appendChild(b);});}
  function renderGrid(){const g=$('grid');g.textContent='';const list=rows.filter(inCat);
    if(!list.length){const h=document.createElement('div');h.className='hint';h.style.gridColumn='1/-1';h.textContent=rows.length?'這個分類還沒有照片':'還沒有照片';g.appendChild(h);return;}
    list.forEach(r=>g.appendChild(cardEl(r)));}
  async function loadGallery(){
    let got=null;const t=sbReady()?await token():null;
    if(sbReady()){const q=(name,hd)=>fetch(SB+'/rest/v1/'+name+'?select=*&order=sort.asc,id.asc&limit=200',{headers:hd});
      try{let r=t?await q('gallery',H(t,{})):await q('gallery_public',{apikey:SB_KEY});
        if(!r.ok&&!t)r=await q('gallery',{apikey:SB_KEY});   /* 還沒建立「隱藏用」的 view：退回原本的資料表 */
        if(r.ok)got=await r.json();}catch(e){}}
    if(got===null){$('cats').hidden=true;$('grid').textContent='';CARDS.forEach(addCard);return;}   /* 還沒接上資料表：維持原本的範例卡片 */
    rows=got;$('cats').hidden=false;renderTabs();renderGrid();}
  /* ---- 調整順序（在最下面的「調整順序」，不會出現在卡片上） ---- */
  let ordList=[];
  function renderOrd(){const box=$('ordList');box.textContent='';
    ordList.forEach((r,i)=>{const row=document.createElement('div');row.className='ordrow';const th=gURL(r.thumb);
      row.innerHTML=(th?`<img src="${th}" alt="">`:'<i></i>')+`<span>${esc(r.title)}</span>`;
      [['▲',-1],['▼',1]].forEach(([s,k])=>{const b=document.createElement('button');b.textContent=s;b.disabled=(i+k<0||i+k>=ordList.length);b.onclick=()=>{[ordList[i],ordList[i+k]]=[ordList[i+k],ordList[i]];renderOrd();};row.appendChild(b);});
      box.appendChild(row);});}
  $('admOrd').onclick=()=>{ordList=rows.filter(inCat);$('ordHint').textContent='目前分類：'+curCat+'（用 ▲▼ 移動，最後按「儲存順序」）';$('ordStatus').textContent='';renderOrd();open('m-order');};
  $('ordSave').onclick=async()=>{const t=await token();if(!t){close('m-order');openLogin();return;}
    const it=ordList[Symbol.iterator](),ids=new Set(ordList.map(r=>r.id)),all=rows.map(r=>ids.has(r.id)?it.next().value:r);$('ordStatus').textContent='儲存中⋯';
    try{const rs=await Promise.all(all.map((r,n)=>r.sort===n+1?null:fetch(SB+'/rest/v1/gallery?id=eq.'+r.id,{method:'PATCH',headers:H(t,J),body:JSON.stringify({sort:n+1})})));
      if(rs.some(r=>r&&!r.ok))throw 0;close('m-order');$('ordStatus').textContent='';await loadGallery();}catch(e){$('ordStatus').textContent='儲存失敗，請稍後再試';}};
  function openGal(row){$('gTitle').textContent=row.title;const box=$('gPhotos');box.textContent='';const adm=!!A.get();
    if(row.locked&&!adm){$('gDate').textContent='';$('gText').style.whiteSpace='pre-wrap';$('gText').textContent='🔒 to be soon ♡';$('gAdm').hidden=true;open('m-gal');return;}
    (row.photos&&row.photos.length?row.photos:[row.thumb]).forEach(n=>{const u=gURL(n);if(!u)return;const im=document.createElement('img');im.src=u;im.alt='';im.loading='lazy';box.appendChild(im);});
    $('gDate').textContent=row.date||'';$('gText').style.whiteSpace='pre-wrap';$('gText').textContent=row.story||'';
    $('gAdm').hidden=!adm;$('gEdit').onclick=()=>{close('m-gal');openEditor(row);};
    $('gDel').onclick=async()=>{if(!confirm('確定要刪除這張卡片嗎？'))return;const t=await token();if(!t){close('m-gal');openLogin();return;}
      try{const r=await fetch(SB+'/rest/v1/gallery?id=eq.'+row.id,{method:'DELETE',headers:H(t,{})});if(!r.ok)throw 0;
        for(const n of [row.thumb,row.blur_thumb,...(row.photos||[])])if(NAME_RE.test(n||''))fetch(SB+'/storage/v1/object/gallery/'+n,{method:'DELETE',headers:H(t,{})}).catch(()=>{});
        close('m-gal');await loadGallery();}catch(e){alert('刪除失敗，請稍後再試');}};
    open('m-gal');}

  /* ---- 登入視窗 ---- */
  function openLogin(){$('lgSt').textContent='';open('m-login');}
  $('admBtn').onclick=async()=>{if(await token())adminUI();else openLogin();};
  $('admOut').onclick=()=>{A.clear();setFlag(false);adminUI();loadGallery();};
  $('lgGo').onclick=async()=>{const st=$('lgSt');if(!sbReady()){st.textContent='尚未連接 Supabase';return;}
    st.textContent='登入中⋯';try{await login($('lgEmail').value.trim(),$('lgPw').value);$('lgPw').value='';close('m-login');adminUI();loadGallery();}catch(e){st.textContent='登入失敗，請確認帳號密碼';}};

  /* ---- 新增／編輯卡片 ---- */
  let files=[],srcs=[],cover=0,cimg=null,z=1,ox=0,oy=0,drag=null,editing=null,recrop=false;
  const base=()=>Math.max(CW/cimg.naturalWidth,CH/cimg.naturalHeight)*z;
  function clamp(){const s=base(),w=cimg.naturalWidth*s,h=cimg.naturalHeight*s;ox=Math.min(0,Math.max(CW-w,ox));oy=Math.min(0,Math.max(CH-h,oy));return[w,h];}
  function drawCrop(){const x=$('eCrop').getContext('2d');x.fillStyle='#ddd';x.fillRect(0,0,CW,CH);if(!cimg)return;const[w,h]=clamp();x.drawImage(cimg,ox,oy,w,h);}
  function setCover(i){cover=i;recrop=!!editing;[...$('eStrip').children].forEach((c,k)=>c.classList.toggle('on',k===i));
    const im=new Image();im.crossOrigin='anonymous';im.onload=()=>{cimg=im;z=1;$('eZoom').value=1;const s=base();ox=(CW-im.naturalWidth*s)/2;oy=(CH-im.naturalHeight*s)/2;$('eCropWrap').hidden=false;drawCrop();};
    im.onerror=()=>{$('eStatus').textContent='讀不到這張照片，無法重新裁切';};im.src=srcs[i];}
  function renderStrip(){const s=$('eStrip');s.textContent='';srcs.forEach((u,i)=>{const im=document.createElement('img');im.src=u;im.alt='';im.title='點一下設為封面';im.onclick=()=>setCover(i);s.appendChild(im);});}
  $('eAddPh').onclick=()=>$('eFile').click();
  $('eFile').onchange=e=>{const fs=[...e.target.files];e.target.value='';if(!fs.length)return;files=[...files,...fs].slice(0,8);srcs=files.map(f=>URL.createObjectURL(f));renderStrip();setCover(files.length===fs.length?0:cover);};
  const cr=$('eCrop');
  cr.addEventListener('pointerdown',e=>{if(!cimg)return;cr.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,ox,oy};});
  cr.addEventListener('pointermove',e=>{if(!drag)return;const k=CW/cr.getBoundingClientRect().width;ox=drag.ox+(e.clientX-drag.x)*k;oy=drag.oy+(e.clientY-drag.y)*k;drawCrop();});
  ['pointerup','pointercancel'].forEach(n=>cr.addEventListener(n,()=>{drag=null;}));
  $('eZoom').oninput=e=>{if(!cimg)return;const w0=cimg.naturalWidth*base(),h0=cimg.naturalHeight*base(),cx=(CW/2-ox)/w0,cy=(CH/2-oy)/h0;z=+e.target.value;
    const w1=cimg.naturalWidth*base(),h1=cimg.naturalHeight*base();ox=CW/2-cx*w1;oy=CH/2-cy*h1;drawCrop();};
  function openEditor(row){editing=row||null;files=[];srcs=row?(row.photos||[]).map(gURL).filter(Boolean):[];cover=0;cimg=null;recrop=false;$('eCropWrap').hidden=true;$('eStatus').textContent='';
    renderStrip();$('ePhotoBox').hidden=false;$('eAddPh').hidden=!!row;$('eHead').textContent=row?'編輯卡片':'新增卡片';
    $('eTitle').value=row?row.title:'';$('eScene').value=row&&row.scene||'';$('eDate').value=row?(row.date||''):new Date().toISOString().slice(0,10).replace(/-/g,'.');$('eStory').value=row&&row.story||'';
    const ec=$('eCat');if(!ec.options.length)[['','（未分類）'],...CATS.map(c=>[c,c])].forEach(([v,t])=>ec.add(new Option(t,v)));ec.value=row?(row.category||''):(curCat!=='ALL'?curCat:'');
    $('eLock').checked=!!(row&&row.locked);$('eNote').hidden=!row;open('m-edit');}
  $('admNew').onclick=async()=>{if(await token())openEditor(null);else openLogin();};
  const blob=(c,q)=>new Promise(res=>c.toBlob(res,'image/jpeg',q));
  function cropCanvas(){const o=document.createElement('canvas');o.width=CW*2;o.height=CH*2;const x=o.getContext('2d'),[w,h]=clamp();x.fillStyle='#fff';x.fillRect(0,0,o.width,o.height);x.drawImage(cimg,ox*2,oy*2,w*2,h*2);return o;}
  /* 模糊版封面：縮到很小再放大，看不出內容。訪客只拿得到這張，拿不到原圖的檔名 */
  function blurBlob(src){const sm=(w,s)=>{const c=document.createElement('canvas');c.width=w;c.height=Math.round(w*CH/CW);const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(s,0,0,c.width,c.height);return c;};
    return blob(sm(CW,sm(32,sm(4,src))),.7);}
  const loadImg=u=>new Promise((res,rej)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>res(i);i.onerror=()=>rej();i.src=u;});
  function fullBlob(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{const s=Math.min(1,1600/Math.max(i.naturalWidth,i.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(i.naturalWidth*s);c.height=Math.round(i.naturalHeight*s);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);blob(c,.86).then(res);};i.onerror=()=>rej();i.src=u;});}
  async function up(t,name,b){const r=await fetch(SB+'/storage/v1/object/gallery/'+name,{method:'POST',headers:H(t,{'Content-Type':'image/jpeg'}),body:b});if(!r.ok)throw 0;}
  const del=(t,n)=>{if(NAME_RE.test(n||''))fetch(SB+'/storage/v1/object/gallery/'+n,{method:'DELETE',headers:H(t,{})}).catch(()=>{});};
  $('eSave').onclick=async()=>{const st=$('eStatus'),btn=$('eSave'),title=$('eTitle').value.trim(),lock=$('eLock').checked;
    if(!title){st.textContent='請輸入標題';return;}
    if(!editing&&!(files.length&&cimg)){st.textContent='請至少選一張照片';return;}
    const t=await token();if(!t){close('m-edit');openLogin();return;}
    const f={title,scene:$('eScene').value.trim()||null,date:$('eDate').value.trim()||null,story:$('eStory').value.trim()||null};
    {const cv=$('eCat').value;if(cv||(editing&&editing.category))f.category=cv||null;}
    btn.disabled=true;
    try{
      if(editing){st.textContent='儲存中⋯';const patch={...f};
        if(recrop&&cimg){const tn=rid()+'.jpg';st.textContent='處理封面中⋯';await up(t,tn,await blob(cropCanvas(),.86));patch.thumb=tn;}
        if(lock){const bn=rid()+'.jpg';st.textContent='製作模糊封面中⋯';
          try{await up(t,bn,await blurBlob(patch.thumb?cropCanvas():await loadImg(gURL(editing.thumb))));patch.blur_thumb=bn;}catch(e){if(!editing.blur_thumb)throw e;}}
        if(lock!==!!editing.locked)patch.locked=lock;
        const r=await fetch(SB+'/rest/v1/gallery?id=eq.'+editing.id,{method:'PATCH',headers:H(t,J),body:JSON.stringify(patch)});if(!r.ok)throw 0;
        if(patch.thumb)del(t,editing.thumb);if(patch.blur_thumb)del(t,editing.blur_thumb);}
      else{st.textContent='處理照片中⋯';const tn=rid()+'.jpg',names=[];await up(t,tn,await blob(cropCanvas(),.86));
        for(let i=0;i<files.length;i++){st.textContent='上傳照片 '+(i+1)+'/'+files.length+'⋯';const n=rid()+'.jpg';await up(t,n,await fullBlob(files[i]));names.push(n);}
        const body={...f,thumb:tn,photos:names,sort:rows.reduce((m,r)=>Math.max(m,r.sort||0),0)+1};
        if(lock){const bn=rid()+'.jpg';st.textContent='製作模糊封面中⋯';await up(t,bn,await blurBlob(cropCanvas()));body.locked=true;body.blur_thumb=bn;}
        st.textContent='儲存中⋯';const r=await fetch(SB+'/rest/v1/gallery',{method:'POST',headers:H(t,J),body:JSON.stringify(body)});if(!r.ok)throw 0;}
      close('m-edit');await loadGallery();
    }catch(e){st.textContent='儲存失敗，請稍後再試（或重新登入）';}
    btn.disabled=false;};
  adminUI();loadGallery();
})();
</script>
<script src="album.js"></script>
</body>
</html>
